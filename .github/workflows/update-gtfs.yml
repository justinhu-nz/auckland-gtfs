name: Update and archive GTFS

on:
  schedule:
    - cron: '23 17 * * *' # About 05:23 NZST / 06:23 NZDT, daily.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gtfs
  cancel-in-progress: false

jobs:
  update:
    # Manual runs on other branches must not publish releases or update main.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Download, validate, archive, and update
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_gtfs.py --archive
      - name: Commit changed feed
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gtfs.zip gtfs
          if ! git diff --cached --quiet; then
            git commit -m "Update Auckland GTFS ($(TZ=Pacific/Auckland date +%F))"
            git push
          fi
