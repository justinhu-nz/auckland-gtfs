name: Test updater

on:
  push:
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -v
